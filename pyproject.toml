[project]
name = "n8n-claude-ops"
version = "0.1.0"
description = "n8n + Claude operations automation: incident triage and inbox/lead triage workflows with a local Python runner."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["anthropic>=2.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "requests>=2.32"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001"]
